name: Generate puzzles

on:
  schedule:
    # Every Monday at 09:00 UTC — keeps a rolling buffer of future puzzles.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Days of puzzles to generate per category'
        default: '14'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run generate -- --count=${{ inputs.count || '14' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/puzzles
          git diff --cached --quiet && echo "No new puzzles to commit." || git commit -m "Generate puzzles"
          git push
